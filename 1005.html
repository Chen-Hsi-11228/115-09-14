<html>
<head>
    <title>1005-CSS容器設定</title>
<style>
    /* 容器 Box
box-sizing:寬高預設是 content-box，也可以改成 border-box;

由內而外是 content內容(寬高)/padding填充/border框線/margin邊界
除了內容，分別可以設定 上top/下bottom/左left/右right
框線再分 粗細width/樣式style/顏色color
框線樣式常見有四種 solid實線/dashed虛線/dotted點點/double雙線
    */
#d1{
width:100px;
height:100px;
background-color: aquamarine;
border: 7px solid rgb(67, 82, 50);
/*border-color: crimson yellow green blue;
border-width: 25px;
border-style: groove; solid/dashed/dotted/double;*/
padding: 13px 2px 50px 25px;
box-sizing: border-box;
margin-bottom:10px;
}
#d2{
border: 2px solid rgb(214, 112, 189);
width:50px;
height:100px;
border-radius: 10px 30px 50px 5px;
}
#d3{
border: 2px solid rgb(0, 0, 0);
width:500px;
height:100px;
border-radius:50%;/*相對單位*/
}
#d4{
width:0px;
height:0px;
border:50px solid rgb(184, 118, 22border: 53);
border-color: chocolate yellow green;
border-width: 20px 0px 60px 80px
}
#diamond1{
width:50px;
height:0px;
border:30px solid transparent;
border-bottom-color: lightblue;
border-top-width: 0;
}
#diamond2{
width:0px;
height:0px;
border:55px solid transparent;
border-top-color: lightblue;
border-bottom-width: 0;
}
#tree1{
width:0px;
height:0px;
border:40px solid transparent;
border-bottom-color: green;
border-top-width: 0;
margin-left:20px;
}
#tree2 {
width: 20px;
height: 0px;
border: 40px solid transparent;
border-bottom-color: green;
border-top-width: 0;
margin-left:10px;
}
#tree3 {
width: 40px;
height: 0px;
border: 40px solid transparent;
border-bottom-color: green;
border-top-width: 0;
}
#tree4 {
width: 40px;
height: 50px;
background-color: brown;
margin-left:40px;
}
#leaf1{
border: 2px solid black;
width:100px;
height:100px;
border-radius: 0px 100px 0px 100px;
background-color: green;
}
#leaf2{
width:30px;
height:40px;
background-color: green;
border: 2px solid black;
}
    
</style>

</head>
<body>
<div id="d1">123</div>
<div id="d2"></div>
<div id="d3"></div>
<div id="d4"></div>
<hr>
<div id="diamond1"></div>
<div id="diamond2"></div>
<hr>
<div id="tree1"></div>
<div id="tree2"></div>
<div id="tree3"></div>
<div id="tree4"></div>
<hr>
作業:自訂創意圖
<div id="leaf1"></div>
<div id="leaf2"></div>
<hr>
</body>

</html>
