<html>
<head>
<title>0921-CSS簡介</title>
<style>/*CSS的註解*//*CSS又稱樣式表*/
/*選擇器有三種:  標籤名稱,#id,class*/
/*
display: block/inline/inline-block;
width: px;
height:px;
color:前景顏色
background-color:背景顏色

顏色的設定方法:
1.英文單字
2.rgb(紅光0~255,綠光0~255,藍光0~255)
3.rgb(紅光0~255,綠光0~255,藍光0~255,可見度0~1)//0=全透明1=不透明
4.色碼 #RRGGBB  00-FF
5.hsl(色相0~360,彩度0~100%,亮度0~100%)
6.hsla(色相0~360,彩度0~100%,亮度0~100%,可見度0~1)//0=全透明1=不透明
*/

p{
background-color: gray;

}

#p1{background-color: darkcyan;

}

.c1{color:rgb(255,8,0,0.5)
    
}
#d1{background-color:#FFFFF
height:50px;
width:50px;
display:inline-block

}

</style>
</head>
<body>

<p id="p1" class="c1">第一個短落</p>
<p>第二個短落</p>
<p class="c1">第三個短落</p>
<p style="color: blue;">第四個短落</p>
<p class="c1" style="color: rgb(2, 2, 31);">第五個短落</p>
<div id="d1"></div>
<span class="s1"></span>


</body>
</html>
